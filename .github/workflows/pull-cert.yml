name: Get Cert Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch cert folder
        run: |
          git clone https://github.com/mzereashte94/nn.git temp-repo
          cp -r temp-repo/cert ./
          rm -rf temp-repo

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cert/
          git diff --quiet && git diff --staged --quiet || git commit -m "Downloaded cert folder"
          git push
